<!DOCTYPE html>
<html><head><title>Gerar Icones PWA</title></head>
<body style="font-family:sans-serif;padding:20px;background:#f0f0f0;">
<h2>Gerador de Icones PWA — Defesa Civil Ivatuba</h2>
<p>Clique nos botoes abaixo para baixar os icones. Depois coloque na pasta <code>assets/logos/</code></p>
<canvas id="c192" width="192" height="192" style="border:1px solid #ccc;margin:10px;"></canvas>
<canvas id="c512" width="512" height="512" style="border:1px solid #ccc;margin:10px;"></canvas>
<br>
<button onclick="download(192)" style="padding:10px 20px;font-size:16px;margin:5px;">Baixar icon-192.png</button>
<button onclick="download(512)" style="padding:10px 20px;font-size:16px;margin:5px;">Baixar icon-512.png</button>

<script>
function drawIcon(size){
  const c=document.getElementById('c'+size);
  const ctx=c.getContext('2d');
  const s=size/512;

  // Background
  ctx.fillStyle='#1A3A6B';
  const r=80*s;
  ctx.beginPath();
  ctx.moveTo(r,0);ctx.lineTo(size-r,0);ctx.quadraticCurveTo(size,0,size,r);
  ctx.lineTo(size,size-r);ctx.quadraticCurveTo(size,size,size-r,size);
  ctx.lineTo(r,size);ctx.quadraticCurveTo(0,size,0,size-r);
  ctx.lineTo(0,r);ctx.quadraticCurveTo(0,0,r,0);
  ctx.fill();

  // Shield shape
  const cx=256*s, cy=200*s, rad=90*s;
  ctx.strokeStyle='#3B82F6';ctx.lineWidth=12*s;
  ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.stroke();

  // Cross inside circle
  ctx.strokeStyle='#60A5FA';ctx.lineWidth=10*s;
  ctx.beginPath();ctx.moveTo(cx,cy-rad*0.55);ctx.lineTo(cx,cy+rad*0.55);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx-rad*0.55,cy);ctx.lineTo(cx+rad*0.55,cy);ctx.stroke();

  // Text DC
  ctx.fillStyle='#FFFFFF';
  ctx.font='800 '+(72*s)+'px Arial,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('DC',256*s,355*s);

  // Text IVATUBA
  ctx.fillStyle='#93C5FD';
  ctx.font='600 '+(36*s)+'px Arial,sans-serif';
  ctx.fillText('IVATUBA',256*s,415*s);

  // Line
  ctx.fillStyle='rgba(59,130,246,0.5)';
  ctx.fillRect(206*s,440*s,100*s,4*s);
}

drawIcon(192);
drawIcon(512);

function download(size){
  const c=document.getElementById('c'+size);
  const a=document.createElement('a');
  a.download='icon-'+size+'.png';
  a.href=c.toDataURL('image/png');
  a.click();
}
</script>
</body></html>
